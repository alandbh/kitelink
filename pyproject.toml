[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kitelink"
version = "0.1.0"
description = "Linux desktop client for Google Drive — Drive Desktop–like experience for GNOME/Nautilus"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kitelink contributors" }]
keywords = ["google-drive", "rclone", "gnome", "nautilus", "linux"]
dependencies = [
  "secretstorage>=3.3",
  "google-auth>=2.28",
  "google-auth-oauthlib>=1.2",
  "requests>=2.31",
]

[project.optional-dependencies]
gui = [
  "PyGObject>=3.46",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
kitelink = "kitelink.app.main:main"
kitelink-service = "kitelink.service.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kitelink = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
